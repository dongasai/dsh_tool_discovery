# 工具发现（@dongasai/dsh-tool-discovery）
#
# 一个 bundle 两半：
#   - Host 半边（index.js）按「全局 → 工作区 → 会话激活」三层策略，
#     决定哪些工具进模型声明、哪些只在系统提示词里留一行索引、哪些完全屏蔽；
#     并注册 tool_find 让模型按需加载。
#   - 浏览器半边（client.js）注册右侧栏两个页签：全局管理 / 工作区管理。
#
# 只插入一行插件；浏览器半边由 dsh-client-modules 扫描同一行的 dsh.client 得到。
#
# 依赖（都在宿主层，同层注入即可解析）：
#   - tools             ：注册表（schemas/guard）与 tool_find 注册
#   - systemPrompt      ：索引段落与 assemble 瀑布过滤
#   - agents            ：sessionId → Agent 解析
#   - webServer         ：面板数据与策略写入路由
#   - connection        ：信任围栏（requestRejection）
#   - workspaceRegistry ：会话 cwd → 工作区记录
- insert:
    - id: tool-discovery
      name: '@dongasai/dsh-tool-discovery'
      config:
        defaultTools:
          - read
          - write
          - edit
          - glob
          - grep
          - bash
          - todo_write
          - ask_user_question
          - skill
          - present
          - read_image
          - tool_find
        blockedTools: []
        indexBudgetChars: 4000
        summaryChars: 80
        workspacePolicyFile: .dsh/tool-policy.json
